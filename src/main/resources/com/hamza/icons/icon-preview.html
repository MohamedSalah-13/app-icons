<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Icon preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #f6f5f1; color: #252923;
      font: 16px/1.5 Inter, "Segoe UI", sans-serif;
    }
    main { max-width: 1024px; margin: auto; padding: 40px clamp(16px, 4vw, 48px); }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 52px); line-height: 1.1; letter-spacing: -.045em; }
    section { margin-top: 32px; }
    h2 { margin: 0 0 10px; font-size: 18px; font-weight: 600; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
    figure { margin: 0; overflow: hidden; border: 1px solid #d7d9d0; border-radius: 12px; background: #fff; }
    .sample {
      display: grid; place-items: center; min-height: 224px;
      background: repeating-conic-gradient(#e7e9e3 0% 25%, #f1f2ee 0% 50%) 0 0 / 16px 16px;
    }
    .small .sample { min-height: 80px; }
    img { display: block; }
    .circle { border-radius: 50%; }
    .rounded-square { border-radius: 24%; }
    figcaption { padding: 12px 16px; border-top: 1px solid #d7d9d0; font-weight: 600; }
    figcaption span { display: block; color: #545c51; font-size: 14px; font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <h1>Icon preview</h1>
    <section class="small">
      <h2>Small sizes</h2>
      <div class="grid">
        <figure>
          <div class="sample"><img src="{{small16}}" width="16" height="16" alt="16-pixel icon" /></div>
          <figcaption>16 × 16 px</figcaption>
        </figure>
        <figure>
          <div class="sample"><img src="{{small32}}" width="32" height="32" alt="32-pixel icon" /></div>
          <figcaption>32 × 32 px</figcaption>
        </figure>
      </div>
    </section>
    <section>
      <h2>Launcher icons</h2>
      <div class="grid">
        <figure>
          <div class="sample"><img src="{{apple}}" width="180" height="180" alt="Apple touch icon" /></div>
          <figcaption>Apple touch<span>180 × 180 px</span></figcaption>
        </figure>
        <figure>
          <div class="sample"><img class="circle" src="{{maskable}}" width="192" height="192" alt="Circular crop" /></div>
          <figcaption>Maskable · Circle<span>192 × 192 px</span></figcaption>
        </figure>
        <figure>
          <div class="sample"><img class="rounded-square" src="{{maskable}}" width="192" height="192" alt="Rounded-square crop" /></div>
          <figcaption>Maskable · Rounded square<span>192 × 192 px</span></figcaption>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
