name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag against pom.xml
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw -LiteralPath pom.xml)).project.version
          if (-not $version -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match project version '$version' in pom.xml"
          }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp verify

      - name: Generate PWA icons and preview on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p target/platform-check
          cp target/*-cli.jar target/platform-check/
          java -jar target/platform-check/*-cli.jar --pwa --preview .github/fixtures/ci-icon.svg target/platform-check/web

      - name: Record SHA-256 of the tested release JAR
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        shell: bash
        working-directory: target/platform-check
        run: |
          jar="app-icons-${GITHUB_REF_NAME#v}-cli.jar"
          sha256sum --binary "$jar" > "$jar.sha256"
          git rev-parse HEAD > tested-commit.txt

      - name: Upload the Windows outputs and the CLI that generated them
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-pwa-preview
          path: target/platform-check/
          include-hidden-files: true
          if-no-files-found: error

  platform-check:
    needs: build
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check: Check Windows PWA icons and preview on Linux
          - os: macos-latest
            check: Open app.icns on macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: windows-pwa-preview
          path: target/platform-check

      - name: Compare the downloaded files with Linux rendering
        if: runner.os == 'Linux'
        run: java -jar target/platform-check/*-cli.jar --check --pwa --preview .github/fixtures/ci-icon.svg target/platform-check/web

      - name: Decode the desktop icon with Apple's iconutil
        if: runner.os == 'macOS'
        run: |
          java -jar target/platform-check/*-cli.jar .github/fixtures/ci-icon.svg target/desktop
          iconutil -c iconset -o target/app.iconset target/desktop/app.icns
          test -s target/app.iconset/icon_512x512@2x.png

      - name: Compile and link Android launcher resources
        if: runner.os == 'Linux'
        run: |
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          platform="$ANDROID_HOME/platforms/android-35/android.jar"
          if [[ ! -x "$aapt2" || ! -f "$platform" ]]; then
            sdkmanager 'build-tools;35.0.0' 'platforms;android-35'
          fi
          app=target/android-sample
          args=(--android --monochrome .github/fixtures/ci-icon.svg .github/fixtures/ci-icon.svg "$app/res")
          java -jar target/platform-check/*-cli.jar "${args[@]}"
          mkdir "$app/res/mipmap-mdpi-v5"
          cp "$app/res/mipmap-mdpi/ic_launcher.png" "$app/res/mipmap-mdpi-v5/"
          java -jar target/platform-check/*-cli.jar --check "${args[@]}"
          "$aapt2" compile --dir "$app/res" -o "$app/resources.zip"
          "$aapt2" link -I "$platform" \
            --manifest .github/fixtures/android/AndroidManifest.xml --min-sdk-version 21 \
            -o "$app/sample.apk" "$app/resources.zip"

          # AAPT2 gives mdpi an implicit v4. Both tools must reject the duplicate.
          mkdir "$app/res/mipmap-mdpi-v4"
          cp "$app/res/mipmap-mdpi/ic_launcher.png" "$app/res/mipmap-mdpi-v4/"
          if java -jar target/platform-check/*-cli.jar --check "${args[@]}" > "$app/check.log" 2>&1; then
            exit 1
          fi
          grep -F '@mipmap/ic_launcher' "$app/check.log"
          "$aapt2" compile --dir "$app/res" -o "$app/duplicate.zip"
          if "$aapt2" link -I "$platform" --manifest .github/fixtures/android/AndroidManifest.xml \
              --min-sdk-version 21 -o "$app/duplicate.apk" "$app/duplicate.zip" > "$app/link.log" 2>&1; then
            exit 1
          fi
          grep -F "'mipmap/ic_launcher' has a conflicting value" "$app/link.log"

  release:
    name: Publish tested CLI
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: platform-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-pwa-preview
          path: release

      - name: Verify checksum and publish GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          jar="app-icons-${GITHUB_REF_NAME#v}-cli.jar"
          sha256sum --check --strict "$jar.sha256"
          tagged_commit=$(gh api "repos/$GH_REPO/commits/refs/tags/$GITHUB_REF_NAME" --jq .sha)
          if [[ "$tagged_commit" != "$(cat tested-commit.txt)" ]]; then
            echo "Tag $GITHUB_REF_NAME no longer points to the tested commit" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$jar" "$jar.sha256" \
            --verify-tag --title "App Icons $GITHUB_REF_NAME" --generate-notes
